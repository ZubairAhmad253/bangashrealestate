# The Supabase free plan pauses a project after 7 days without activity.
# This sends a tiny request every 3 days to keep the project active.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf "https://tgqqhzunbkyifcesfndd.supabase.co/rest/v1/settings?select=id&limit=1" \
            -H "apikey: sb_publishable_Xa7aSCfk7V3jKSEFDwfeiQ_uv0au2ub" -o /dev/null -w "HTTP %{http_code}\n"
